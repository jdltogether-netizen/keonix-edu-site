<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEONIX · Verification</title>
<link rel="stylesheet" href="assets/css/style.css?v=5bd0b37e">
</head><body>
<header class="bar"><a class="brand" href="index.html">KEONIX</a>
<span class="tag i18n" data-en="Verification" data-ko="인증 확인">Verification</span>
<button id="langToggle" class="lang" type="button" aria-label="Change language">한국어</button></header>
<main class="wrap">

<div class="card center">
  <h1><span class="i18n" data-en="Certificate verification" data-ko="인증서 확인">Certificate verification</span></h1>
  <p class="muted"><span class="i18n" data-en="Enter the certificate ID printed on the certificate, or scan its QR code." data-ko="인증서에 표시된 인증서 번호를 입력하거나 QR 코드를 스캔하세요.">Enter the certificate ID printed on the certificate, or scan its QR code.</span></p>
  <form id="lookup" class="lookup" role="search">
    <input id="cid" name="cid" placeholder="e.g. KX26XXXXXXXX"
           data-en-ph="e.g. KX26XXXXXXXX" data-ko-ph="예: KX26XXXXXXXX" autocomplete="off"
           autocapitalize="characters" spellcheck="false" aria-label="Certificate ID">
    <button type="submit" class="i18n" data-en="Verify" data-ko="확인">Verify</button>
  </form>
  <p class="muted small"><span class="i18n" data-en="Certificates are private. You can only verify an ID you already have." data-ko="인증서는 비공개입니다. 이미 보유한 번호만 확인할 수 있습니다.">Certificates are private. You can only verify an ID you already have.</span></p>
</div>
<script>
document.getElementById('lookup').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var v = document.getElementById('cid').value.trim();
  if (!v) return;
  var m = v.match(/[A-Za-z0-9_-]+$/);            // tolerate a pasted full URL
  var id = (m ? m[0] : v).replace(/\.html$/i, '');
  window.location.href = 'cert/' + encodeURIComponent(id) + '.html';
});
</script>
</main>
<footer class="foot"><span class="i18n" data-en="Generated by the KEONIX certification pipeline · static verification, no server." data-ko="KEONIX 인증 발급 시스템에서 자동 생성됨 · 서버 없는 정적 검증">Generated by the KEONIX certification pipeline · static verification, no server.</span></footer>
<script>
(function () {
  function detect() {
    try { var s = localStorage.getItem('lang'); if (s) return s; } catch (e) {}
    return (navigator.language || 'en').slice(0, 2) === 'ko' ? 'ko' : 'en';
  }
  var lang = detect();
  function apply(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('.i18n').forEach(function (el) {
      var v = el.getAttribute('data-' + l); if (v !== null) el.textContent = v;
    });
    document.querySelectorAll('[data-en-ph]').forEach(function (el) {
      var v = el.getAttribute('data-' + l + '-ph'); if (v !== null) el.placeholder = v;
    });
    var b = document.getElementById('langToggle');
    if (b) b.textContent = l === 'ko' ? 'English' : '한국어';
    try { localStorage.setItem('lang', l); } catch (e) {}
  }
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.getElementById('langToggle');
    if (b) b.addEventListener('click', function () { apply(lang === 'ko' ? 'en' : 'ko'); });
    apply(lang);
  });
})();
</script>
</body></html>
