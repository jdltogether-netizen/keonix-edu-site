<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Not found · KEONIX</title>
<link rel="stylesheet" href="/assets/css/style.css?v=5bd0b37e">
</head><body>
<header class="bar"><a class="brand" href="/">KEONIX</a>
<span class="tag i18n" data-en="Verification" data-ko="인증 확인">Verification</span>
<button id="langToggle" class="lang" type="button" aria-label="Change language">한국어</button></header>
<main class="wrap">

<div class="card center">
  <h1><span class="i18n" data-en="Certificate not found" data-ko="인증서를 찾을 수 없습니다">Certificate not found</span></h1>
  <p class="muted"><span class="i18n" data-en="This ID does not match any issued certificate. Check the ID and try again." data-ko="이 번호와 일치하는 발급된 인증서가 없습니다. 번호를 확인한 후 다시 시도하세요.">This ID does not match any issued certificate. Check the ID and try again.</span></p>
  <p><a href="/"><span class="i18n" data-en="Back to verification" data-ko="인증 확인으로 돌아가기">Back to verification</span></a></p>
</div>

</main>
<footer class="foot"><span class="i18n" data-en="Generated by the KEONIX certification pipeline · static verification, no server." data-ko="KEONIX 인증 발급 시스템에서 자동 생성됨 · 서버 없는 정적 검증">Generated by the KEONIX certification pipeline · static verification, no server.</span></footer>
<script>
(function () {
  function detect() {
    try { var s = localStorage.getItem('lang'); if (s) return s; } catch (e) {}
    return (navigator.language || 'en').slice(0, 2) === 'ko' ? 'ko' : 'en';
  }
  var lang = detect();
  function apply(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('.i18n').forEach(function (el) {
      var v = el.getAttribute('data-' + l); if (v !== null) el.textContent = v;
    });
    document.querySelectorAll('[data-en-ph]').forEach(function (el) {
      var v = el.getAttribute('data-' + l + '-ph'); if (v !== null) el.placeholder = v;
    });
    var b = document.getElementById('langToggle');
    if (b) b.textContent = l === 'ko' ? 'English' : '한국어';
    try { localStorage.setItem('lang', l); } catch (e) {}
  }
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.getElementById('langToggle');
    if (b) b.addEventListener('click', function () { apply(lang === 'ko' ? 'en' : 'ko'); });
    apply(lang);
  });
})();
</script>
</body></html>
